apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notes-prod
resources:
  - namespace.yaml
  - ../../base
images:
  - name: notes-api
    newName: ghcr.io/nuvyaro/notes-api
    newTag: latest               # CI replaces this with the commit SHA (kustomize edit set image)
patches:
  - target:
      kind: Deployment
      name: notes-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: notes-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target:
      kind: Ingress
      name: notes-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: notes.example.com
  - target:
      kind: ConfigMap
      name: notes-api-config
    patch: |-
      - op: replace
        path: /data/GREETING
        value: "Hello from production"
