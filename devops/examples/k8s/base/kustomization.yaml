apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: notes
    includeSelectors: false
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - redis.yaml
images:
  - name: notes-api
    newName: ghcr.io/nuvyaro/notes-api
    newTag: latest
