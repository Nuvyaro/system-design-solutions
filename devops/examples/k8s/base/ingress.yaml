apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes-api
spec:
  ingressClassName: nginx
  rules:
    - host: notes.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: notes-api
                port:
                  name: http
