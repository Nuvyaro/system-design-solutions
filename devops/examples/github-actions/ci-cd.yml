# CI/CD pipeline for notes-api.
# To use it, copy this file to .github/workflows/ci-cd.yml in your repository.
#
#   push / PR ──► test ──► build & scan image ──► validate manifests
#                                │ (main only)
#                                ▼
#                      push image to GHCR ──► deploy staging ──► [manual approval] ──► deploy production
#
# Required setup (repository Settings):
#   • Environments "staging" and "production" (add required reviewers on "production" for the approval gate)
#   • Secret KUBECONFIG_STAGING / KUBECONFIG_PRODUCTION in each environment (base64-encoded kubeconfig)
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel older runs of the same branch/PR when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: devops/examples/app
  K8S_DIR: devops/examples/k8s

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: pip install -r requirements.txt pytest ruff
      - name: Lint
        working-directory: ${{ env.APP_DIR }}
        run: ruff check .
      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}
        run: pytest -q

  build:
    name: Build, scan & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GitHub Container Registry
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image name and tag
        id: vars
        run: |
          echo "image=$(echo "ghcr.io/${{ github.repository_owner }}/notes-api" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          load: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha

  validate-manifests:
    name: Validate Kubernetes manifests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Build and validate overlays
        run: |
          for env in staging production; do
            kustomize build "$K8S_DIR/overlays/$env" | kubeconform -strict -summary -kubernetes-version 1.30.0
          done

  deploy-staging:
    name: Deploy to staging
    needs: [build, validate-manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.notes.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/config
      - name: Pin image tag and apply
        working-directory: ${{ env.K8S_DIR }}/overlays/staging
        run: |
          kustomize edit set image notes-api=${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
          kustomize build . | kubectl apply -f -
          kubectl -n notes-staging rollout status deployment/notes-api --timeout=180s
      - name: Smoke test
        run: curl --fail --retry 5 --retry-delay 5 https://staging.notes.example.com/healthz

  deploy-production:
    name: Deploy to production
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production          # required reviewers on this environment = manual approval gate
      url: https://notes.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
      - name: Pin image tag and apply
        working-directory: ${{ env.K8S_DIR }}/overlays/production
        run: |
          kustomize edit set image notes-api=${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
          kustomize build . | kubectl apply -f -
          if ! kubectl -n notes-prod rollout status deployment/notes-api --timeout=300s; then
            echo "Rollout failed, rolling back"
            kubectl -n notes-prod rollout undo deployment/notes-api
            exit 1
          fi
